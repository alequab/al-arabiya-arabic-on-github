name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool tests
        run: python code/test_tools.py
      - name: Check the guide pages (the test pages are broken on purpose and are not checked)
        run: python code/check_arabic_md.py --no-info README.md AGENTS.md CONTRIBUTING.md docs templates
