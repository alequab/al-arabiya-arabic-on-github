name: "مصطلح · Term"
description: "اقترح كلمة عربية لمصطلح في المسرد · Suggest an Arabic word for a glossary term"
body:
  - type: markdown
    attributes:
      value: |
        <p dir="rtl">انظر <a href="https://github.com/alequab/al-arabiya-arabic-on-github/blob/main/docs/glossary.md">المسرد</a> أولًا. اكتب بالعربية أو بالإنجليزية. · See the <a href="https://github.com/alequab/al-arabiya-arabic-on-github/blob/main/docs/glossary.md">glossary</a> first. Write in Arabic or English.</p>
  - type: input
    id: term
    attributes:
      label: "المصطلح الإنجليزي · English term"
      description: "مثل commit · For example commit"
    validations:
      required: true
  - type: input
    id: word
    attributes:
      label: "الكلمة العربية التي تقترحها · The Arabic word you suggest"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "لماذا؟ وما مصدرها؟ · Why, and what is the source?"
      description: "معجم، أو واجهة برنامج مترجمة، أو كتاب، مع رابط إن أمكن · A dictionary, a translated program, or a book, with a link if you can"
    validations:
      required: true
