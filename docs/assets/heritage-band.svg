<svg xmlns="http://www.w3.org/2000/svg" width="840" height="64" viewBox="0 0 840 64" role="img" aria-label="Geometric band of eight-pointed stars">
  <!-- Eight-pointed star (khatam) band. Transparent background, so it reads on light and dark pages. -->
  <defs>
    <pattern id="tile" width="60" height="64" patternUnits="userSpaceOnUse">
      <g transform="translate(30 32)" fill="none" stroke="#C9A24D" stroke-width="2" stroke-linejoin="round">
        <rect x="-17" y="-17" width="34" height="34" fill="#2B6A8F" fill-opacity="0.35"/>
        <rect x="-17" y="-17" width="34" height="34" transform="rotate(45)" fill="#2B6A8F" fill-opacity="0.35"/>
        <circle r="7" fill="#C9A24D" fill-opacity="0.55"/>
        <path d="M-30 0 L-24 -6 L-24 6 Z M30 0 L24 -6 L24 6 Z"/>
      </g>
    </pattern>
  </defs>
  <rect width="840" height="64" fill="url(#tile)"/>
  <line x1="0" y1="2" x2="840" y2="2" stroke="#C9A24D" stroke-width="2"/>
  <line x1="0" y1="62" x2="840" y2="62" stroke="#C9A24D" stroke-width="2"/>
</svg>
